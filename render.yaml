# Render Blueprint for Warehouse Now Review Tool
# Single web service: Express serves the REST API AND the built React client.
# Plus a managed Postgres database.
databases:
  - name: review-tool-db
    plan: free
    databaseName: review_tool
    user: review_tool

services:
  - type: web
    name: review-tool
    runtime: node
    plan: starter
    rootDir: .
    # Build server + client, apply DB migrations, then seed (idempotent).
    buildCommand: npm install && npm run build && npm --workspace server run migrate:deploy && npm --workspace server run seed
    startCommand: npm --workspace server run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: review-tool-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_VERSION
        value: "20"
      # Client is served same-origin, so no VITE_API_BASE_URL / CLIENT_ORIGIN needed.
      - key: SEED_ADMIN_NAME
        value: Admin
      - key: SEED_ADMIN_EMAIL
        value: admin@warehousenow.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
