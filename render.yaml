# Render Blueprint for Warehouse Now Review Tool
# Provisions: managed Postgres + Express API (web service) + React static site.
databases:
  - name: review-tool-db
    plan: free
    databaseName: review_tool
    user: review_tool

services:
  # ---- Backend API ----
  - type: web
    name: review-tool-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm --workspace server run build && npm --workspace server run migrate:deploy
    startCommand: npm --workspace server run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: review-tool-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_VERSION
        value: "20"
      - key: CLIENT_ORIGIN
        # Set this to your static site URL after first deploy, e.g.
        # https://review-tool-web.onrender.com
        sync: false
      - key: SEED_ADMIN_NAME
        value: Admin
      - key: SEED_ADMIN_EMAIL
        value: admin@warehousenow.local
      - key: SEED_ADMIN_PASSWORD
        sync: false

  # ---- Frontend static site ----
  - type: web
    name: review-tool-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm --workspace client run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_BASE_URL
        # Set to the API service URL, e.g. https://review-tool-api.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
